# Gradle
org.gradle.jvmargs=-Xmx3G -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true

# Mod identity
mod_id=alpineshred
mod_name=Alpine Shred
mod_version=0.1.0-alpha.1
mod_license=All Rights Reserved
mod_authors=Alvin
maven_group=io.github.adang101.alpineshred
archives_name=alpineshred
enabled_platforms=fabric,forge

# Minecraft (1.20.1 only for v1.0, section 2)
minecraft_version=1.20.1
java_version=17
parchment_version=2023.09.03

# Pinned 2026-10-28 (design doc sections 3 and 4). Re-verify before each release.
#   Forge 1.20.1 latest/recommended promotion: 47.4.28
#   Fabric API: latest 0.92.x is 0.92.12; 0.92.6 is the widely deployed baseline that
#   Trinkets 3.7.x and Cardinal Components were built against.
architectury_api_version=9.2.14
fabric_loader_version=0.16.14
fabric_api_version=0.92.6+1.20.1
forge_version=47.4.28

# Required libraries
#   PlayerAnimator is bug-fix-only upstream; Player Animation Library has no 1.20.1
#   builds (oldest is 1.21.1), so risk R1 resolves to "ship on PlayerAnimator, move to
#   PAL with the 1.21 port". Everything goes through client/anim/RiderAnimator.
player_anim_version=1.0.2-rc1+1.20
curios_version=5.14.1+1.20.1
trinkets_version=3.7.2

# Optional integration: Create (phase 9 plan decision 1, README 77). Compiled against with modCompileOnly, never
# bundled; -PwithCreate also puts it on the dev runtime (the CI "with Create" column).
#   Forge: Create's own maven (maven.createmod.net), the -slim jar, plus the mods it needs at runtime.
#   Fabric: Create Fabric 6.0.8.1 from Modrinth's maven; the jar carries Flywheel, Ponder, Registrate and
#   Porting Lib inside it (jar-in-jar), so nothing else is listed.
create_forge_version=6.0.8-291
create_flywheel_version=1.0.6
create_ponder_version=1.0.92
create_registrate_version=MC1.20-1.3.11
create_fabric_version=6.0.8.1+build.1744-mc1.20.1
create_fabric_loader_version=0.17.2
# Create's mixins use MixinExtras, which Forge's dev runtime does not provide (the Create column only).
create_mixinextras_version=0.4.1

# Tests
junit_version=5.10.2
