modLoader = "javafml"
loaderVersion = "[47,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
Snowboards, skis, park features, groomed runs and ski lifts. Ride natural slopes, hit rails and
kickers for trick scores, and take the lift back to the top.
'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.20.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "architectury"
mandatory = true
versionRange = "[${arch_api},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "curios"
mandatory = true
versionRange = "[5.2.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "playeranimator"
mandatory = true
versionRange = "*"
ordering = "NONE"
side = "BOTH"

# Optional: the kinetic lift drive and wrench support load only when Create is present (section 14).
[[dependencies.${mod_id}]]
modId = "create"
mandatory = false
versionRange = "[6.0.0,)"
ordering = "AFTER"
side = "BOTH"
