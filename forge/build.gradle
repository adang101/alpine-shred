plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

// Resolved up front: inside Loom's run closures, rootProject resolves against the run config.
def modId = rootProject.mod_id

loom {
    forge {
        mixinConfig 'alpineshred.mixins.json'
        mixinConfig 'alpineshred.client.mixins.json'
    }
    runs {
        // Headless game tests on Forge's game-test server; exits non-zero if a required test fails.
        // A dedicated server switched into Forge's game-test mode: forge.gameTestServer makes it start
        // GameTestServer, run every enabled test and exit with the failure count.
        gameTestServer {
            server()
            name 'Game Test Server'
            property 'forge.enableGameTest', 'true'
            property 'forge.gameTestServer', 'true'
            property 'forge.enabledGameTestNamespaces', modId
            runDir 'build/gametest'
        }
        // The real client on a virtual display, riding a generated run with simulated keys (CI only).
        smokeClient {
            client()
            name 'Client Smoke Test'
            property 'alpineshred.smoke', 'true'
            runDir 'build/smoke'
        }
        // The same client riding real terrain: the nearest snowy slopes of a default world (risk R4).
        mountainClient {
            client()
            name 'Mountain Smoke Test'
            property 'alpineshred.smoke', 'true'
            property 'alpineshred.smoke.scenario', 'mountain'
            runDir 'build/smoke-mountain'
        }
        // A park line: rail, boxes, quarter pipe, then the wrench overlay and rail ghost (phase 4).
        parkClient {
            client()
            name 'Park Smoke Test'
            property 'alpineshred.smoke', 'true'
            property 'alpineshred.smoke.scenario', 'park'
            runDir 'build/smoke-park'
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"
    modImplementation "dev.architectury:architectury-forge:${rootProject.architectury_api_version}"

    modImplementation "dev.kosmx.player-anim:player-animation-lib-forge:${rootProject.player_anim_version}"
    modCompileOnly "top.theillusivec4.curios:curios-forge:${rootProject.curios_version}:api"
    modRuntimeOnly "top.theillusivec4.curios:curios-forge:${rootProject.curios_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    def props = [
            version    : project.version,
            mod_id     : rootProject.mod_id,
            mod_name   : rootProject.mod_name,
            mod_license: rootProject.mod_license,
            mod_authors: rootProject.mod_authors,
            arch_api   : rootProject.architectury_api_version,
    ]
    inputs.properties props
    filesMatching('META-INF/mods.toml') {
        expand props
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
