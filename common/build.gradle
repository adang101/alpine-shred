architectury {
    common rootProject.enabled_platforms.split(',')
}

sourceSets {
    main {
        resources {
            // Written by :fabric:runDatagen (section 4). Both loaders package it through this module.
            srcDir 'src/main/generated'
            exclude '.cache/**'
        }
    }
}

dependencies {
    // Fabric Loader is on the common classpath only for its mixin and annotation dependencies.
    // Common code must not import net.fabricmc classes.
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "dev.architectury:architectury:${rootProject.architectury_api_version}"
    // Rider animation (client only; each loader ships the matching PlayerAnimator jar as a dependency).
    modCompileOnly "dev.kosmx.player-anim:player-animation-lib:${rootProject.player_anim_version}"
    // Its keyframe and layer API lives in anim-core, which the loader jars bundle but the common jar does not.
    compileOnly "dev.kosmx.player-anim:anim-core:${rootProject.player_anim_version}"
    // The pure keyframe core, so unit tests can parse and play the clip files.
    testImplementation "dev.kosmx.player-anim:anim-core:${rootProject.player_anim_version}"
}
