# TEMPORARY (WP2): find Create's published versions and dump its API. Deleted before the WP is handed back.
name: create-probe
on:
  push:
    branches: ['wip/phase-9-wp2']
    paths: ['.github/workflows/create-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ponder contents
        run: |
          set +e
          curl -sS -m 60 -o p.jar "https://maven.createmod.net/net/createmod/ponder/Ponder-Forge-1.20.1/1.0.92/Ponder-Forge-1.20.1-1.0.92.jar"
          unzip -l p.jar | grep -E "jarjar|\.jar$|catnip/lang/LangBuilder" | head
          unzip -p p.jar META-INF/mods.toml | grep -E "modId|versionRange|mandatory" | head -30
          unzip -p p.jar META-INF/jarjar/metadata.json | head -c 800
          curl -sS -m 60 -o w.jar "https://maven.createmod.net/dev/engine-room/flywheel/flywheel-forge-1.20.1/1.0.6/flywheel-forge-1.20.1-1.0.6.jar"
          unzip -l w.jar | grep -E "jarjar|\.jar$" | head
          unzip -p w.jar META-INF/mods.toml | grep -E "modId|versionRange|mandatory" | head
          curl -sS -m 60 -o r.jar "https://maven.tterrag.com/com/tterrag/registrate/Registrate/MC1.20-1.3.11/Registrate-MC1.20-1.3.11.jar"
          unzip -p r.jar META-INF/mods.toml | grep -E "modId|versionRange" | head
