# TEMPORARY (WP2): find Create's published versions and dump its API. Deleted before the WP is handed back.
name: create-probe
on:
  push:
    branches: ['wip/phase-9-wp2']
    paths: ['.github/workflows/create-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Fabric metadata and pom
        run: |
          FB=https://mvn.devos.one/snapshots/com/simibubi/create/create-fabric-1.20.1
          curl -sS -m 30 $FB/maven-metadata.xml > fm.xml
          grep -E "<latest>|<release>|<lastUpdated>" fm.xml
          grep -E "<version>6\.0\.[89]" fm.xml
          V=$(grep -oE "<version>6\.0\.8\.1[^<]*" fm.xml | sed 's/<version>//' | tail -1)
          [ -z "$V" ] && V=$(grep -oE "<version>6\.[^<]*" fm.xml | sed 's/<version>//' | tail -1)
          echo "FABRIC VERSION: $V"
          curl -sS -m 30 "$FB/$V/create-fabric-1.20.1-$V.pom" | grep -E "groupId|artifactId|<version>|<scope>|<url>" | head -150
          curl -sS -m 60 -o cf.jar -w "jar HTTP %{http_code}\n" "$FB/$V/create-fabric-1.20.1-$V.jar"
          unzip -l cf.jar | grep -E "META-INF/jars|fabric.mod.json" | head -40
          unzip -p cf.jar fabric.mod.json | head -c 3500
      - name: Forge pom
        run: |
          B=https://maven.createmod.net/com/simibubi/create/create-1.20.1/6.0.8-291
          curl -sS -m 30 "$B/create-1.20.1-6.0.8-291.pom" | grep -E "groupId|artifactId|<version>|<scope>|classifier" | head -80
          curl -sS -m 30 "$B/" | head -30
          curl -sS -m 60 -o cs.jar -w "slim HTTP %{http_code}\n" "$B/create-1.20.1-6.0.8-291-slim.jar"
          curl -sS -m 60 -o cp.jar -w "plain HTTP %{http_code}\n" "$B/create-1.20.1-6.0.8-291.jar"
          ls -l *.jar
      - name: Class names
        run: |
          for j in cs.jar cf.jar; do echo "##### $j"; unzip -Z1 $j | grep -E "Wrench|wrench|Stress|IRotate|KineticBlock|SpeedLevel|AllTags|/Create.class|AllBlocks.class|BlockMovementChecks|api/" | grep -v "\$[0-9]" | grep -E "\.class$" | head -150; done
      - name: javap
        run: |
          for j in cs.jar cf.jar; do
            echo "##### $j"
            for c in com.simibubi.create.content.kinetics.base.KineticBlockEntity com.simibubi.create.content.kinetics.base.IRotate 'com.simibubi.create.content.kinetics.base.IRotate$SpeedLevel' 'com.simibubi.create.content.kinetics.base.IRotate$StressImpact' com.simibubi.create.content.kinetics.base.KineticBlock com.simibubi.create.content.kinetics.base.DirectionalKineticBlock com.simibubi.create.content.kinetics.base.HorizontalKineticBlock com.simibubi.create.content.equipment.wrench.IWrenchable com.simibubi.create.content.equipment.wrench.WrenchItem com.simibubi.create.AllTags 'com.simibubi.create.AllTags$AllBlockTags' 'com.simibubi.create.AllTags$AllItemTags' com.simibubi.create.api.stress.BlockStressValues com.simibubi.create.content.kinetics.BlockStressValues com.simibubi.create.foundation.block.IBE com.simibubi.create.Create com.simibubi.create.foundation.blockEntity.SmartBlockEntity com.simibubi.create.content.kinetics.base.GeneratingKineticBlockEntity com.simibubi.create.content.kinetics.base.KineticEffectHandler com.simibubi.create.content.kinetics.simpleRelays.ICogWheel com.simibubi.create.content.kinetics.base.IRotate\$StressImpact; do
              echo "=== $c"; javap -p -cp $j "$c" 2>&1 | head -120
            done
          done
