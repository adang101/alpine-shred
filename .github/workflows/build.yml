name: build

on:
  push:
    branches: ['**', '!ci-logs', '!ci-logs-create']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        # Explicit bash turns on pipefail, so piping Gradle through tee keeps its exit code.
        shell: bash
    env:
      # Gradle runs on 21 (Architectury Loom 1.11 needs it); the mod compiles, tests and runs on 17.
      GRADLE_ARGS: >-
        --stacktrace --no-daemon
        -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
        -Porg.gradle.java.installations.auto-download=false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v5

      - name: Prepare log folder
        run: mkdir -p "$RUNNER_TEMP/ci-logs"

      # The Fabric kinetic drive extends Create's block entity, so javac needs Create's nested jars (Porting Lib)
      # on the compile classpath, in this job as well as in the one with Create (README 79).
      - name: Unpack Create's nested jars (Fabric)
        run: .github/scripts/unpack-create-nested.sh

      # Data generation first: tags, recipes, loot and lang feed the jars and the game tests.
      - name: Generate data (Fabric datagen into common/src/main/generated)
        timeout-minutes: 20
        run: .github/scripts/run-datagen.sh "$RUNNER_TEMP/ci-logs/1-datagen.log" $GRADLE_ARGS

      - name: Compile all modules, run unit tests, build jars
        if: success() || failure()
        run: ./gradlew build --continue $GRADLE_ARGS 2>&1 | tee "$RUNNER_TEMP/ci-logs/2-build.log"

      - name: Fabric game tests (headless dedicated server)
        if: success() || failure()
        timeout-minutes: 15
        run: ./gradlew :fabric:runGametest $GRADLE_ARGS 2>&1 | tee "$RUNNER_TEMP/ci-logs/3-fabric-gametest.log"

      - name: Forge game tests (headless game-test server)
        if: success() || failure()
        timeout-minutes: 15
        run: |
          mkdir -p forge/build/gametest && echo "eula=true" > forge/build/gametest/eula.txt
          ./gradlew :forge:runGameTestServer $GRADLE_ARGS 2>&1 | tee "$RUNNER_TEMP/ci-logs/4-forge-gametest.log"

      # Phase 7's visual review: a default world with structures on; the server finds, builds and
      # counts the nearest of each Alpine Shred structure and the client pictures it from above.
      - name: Worldgen tour (Forge client, default world)
        if: success() || failure()
        timeout-minutes: 25
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          mkdir -p forge/build/smoke-worldgen/config
          printf '%s\n' onboardAccessibility:false skipMultiplayerWarning:true tutorialStep:none \
            pauseOnLostFocus:false renderDistance:10 simulationDistance:6 narrator:0 maxFps:30 \
            joinedFirstServer:true soundCategory_master:0.0 > forge/build/smoke-worldgen/options.txt
          printf 'earlyWindowControl = false\n' > forge/build/smoke-worldgen/config/fml.toml
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :forge:runWorldgenClient $GRADLE_ARGS 2>&1 \
            | tee "$RUNNER_TEMP/ci-logs/7b-worldgen.log"
          cat forge/build/smoke-worldgen/alpineshred-smoke.txt
          grep -q "^RESULT PASS" forge/build/smoke-worldgen/alpineshred-smoke.txt

      # The real Forge client on a virtual display (Mesa software GL): starts, creates a flat world,
      # rides a generated run with simulated keys, takes screenshots and quits (ClientSmoke). Forge,
      # because the Fabric dev client cannot start: Trinkets 3.7.2 shadows a Yarn field name that
      # does not resolve under Mojang mappings in development (production jars are unaffected).
      - name: Client smoke test (Forge client, virtual display)
        if: success() || failure()
        timeout-minutes: 20
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          mkdir -p forge/build/smoke/config
          printf '%s\n' onboardAccessibility:false skipMultiplayerWarning:true tutorialStep:none \
            pauseOnLostFocus:false renderDistance:6 simulationDistance:6 narrator:0 maxFps:30 \
            joinedFirstServer:true soundCategory_master:0.0 > forge/build/smoke/options.txt
          printf 'earlyWindowControl = false\n' > forge/build/smoke/config/fml.toml
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :forge:runSmokeClient $GRADLE_ARGS 2>&1 \
            | tee "$RUNNER_TEMP/ci-logs/6-client-smoke.log"
          cat forge/build/smoke/alpineshred-smoke.txt
          grep -q "^RESULT PASS" forge/build/smoke/alpineshred-smoke.txt

      # Risk R4: the same client rides a minute down the nearest snowy slopes of a default world,
      # steering down the fall line; any server validator violation fails it.
      - name: Mountain ride (Forge client, real terrain)
        if: success() || failure()
        timeout-minutes: 20
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p forge/build/smoke-mountain/config
          cp forge/build/smoke/options.txt forge/build/smoke-mountain/options.txt
          printf 'earlyWindowControl = false\n' > forge/build/smoke-mountain/config/fml.toml
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :forge:runMountainClient $GRADLE_ARGS 2>&1 \
            | tee "$RUNNER_TEMP/ci-logs/7-mountain.log"
          cat forge/build/smoke-mountain/alpineshred-smoke.txt
          grep -q "^RESULT PASS" forge/build/smoke-mountain/alpineshred-smoke.txt

      # Phase 4: the client rides a park line (rail, boxes, quarter pipe) and pictures the tools.
      - name: Park ride (Forge client)
        if: success() || failure()
        timeout-minutes: 20
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p forge/build/smoke-park/config
          cp forge/build/smoke/options.txt forge/build/smoke-park/options.txt
          printf 'earlyWindowControl = false\n' > forge/build/smoke-park/config/fml.toml
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :forge:runParkClient $GRADLE_ARGS 2>&1 \
            | tee "$RUNNER_TEMP/ci-logs/8-park.log"
          cat forge/build/smoke-park/alpineshred-smoke.txt
          grep -q "^RESULT PASS" forge/build/smoke-park/alpineshred-smoke.txt

      # Phase 8: the client builds a powered lift beside spawn, takes pictures of it, then a strapped
      # rider boards, rides to the top and is ejected into a glide; the renderers' frame cost is checked.
      - name: Lift ride (Forge client)
        if: success() || failure()
        timeout-minutes: 20
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p forge/build/smoke-lift/config
          cp forge/build/smoke/options.txt forge/build/smoke-lift/options.txt
          printf 'earlyWindowControl = false\n' > forge/build/smoke-lift/config/fml.toml
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :forge:runLiftClient $GRADLE_ARGS 2>&1 \
            | tee "$RUNNER_TEMP/ci-logs/8b-lift.log"
          cat forge/build/smoke-lift/alpineshred-smoke.txt
          grep -q "^RESULT PASS" forge/build/smoke-lift/alpineshred-smoke.txt

      # Phase 2's exit gate: a dedicated server and three clients (a rider, two watchers) on one
      # machine; the watchers must see the rider's state, track and animation. Phase 8 adds a lift
      # stage: all three ride a lift of over 400 blocks, watcher1 relogs mid-ride, a head is broken.
      - name: Multiplayer (Forge dedicated server, three clients)
        if: success() || failure()
        timeout-minutes: 45
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: .github/scripts/multiplayer-smoke.sh "$RUNNER_TEMP/ci-logs" $GRADLE_ARGS

      - name: Probe API signatures (when .github/api-probe.txt exists)
        if: (success() || failure()) && hashFiles('.github/api-probe.txt') != ''
        run: .github/scripts/api-probe.sh "$RUNNER_TEMP/ci-logs/api" .github/api-probe.txt

      - name: Committed generated data is up to date
        if: success() || failure()
        run: |
          git add -N common/src/main/generated
          if ! git diff --quiet -- common/src/main/generated; then
            echo "::error::Generated data differs from the committed copy. Run ./gradlew :fabric:runDatagen and commit common/src/main/generated."
            git diff --stat -- common/src/main/generated | tee "$RUNNER_TEMP/ci-logs/5-generated-diff.log"
            exit 1
          fi

      # Logs, reports and generated data also go to the ci-logs branch, readable with plain git
      # from environments that cannot download Actions artifacts.
      # Best effort: runs on other branches force-push the same log branch, and a lost race ("cannot lock ref")
      # is not a test result. The step still shows its error; the job's outcome comes from the tests.
      - name: Publish logs to the ci-logs branch
        if: always()
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          L="$RUNNER_TEMP/ci-logs"
          copy() { if [ -e "$1" ]; then mkdir -p "$L/$2" && cp -r "$1" "$L/$2/" ; fi; }
          copy common/src/main/generated generated
          copy common/build/test-results test-results
          copy common/build/reports/tests reports
          copy fabric/build/gametest/logs fabric-gametest
          copy fabric/build/gametest/crash-reports fabric-gametest
          copy fabric/build/gametest/junit.xml fabric-gametest
          copy fabric/build/datagen/logs fabric-datagen
          copy forge/build/smoke/logs client-smoke
          copy forge/build/smoke/crash-reports client-smoke
          copy forge/build/smoke/screenshots client-smoke
          copy forge/build/smoke/alpineshred-smoke.txt client-smoke
          copy forge/build/smoke-mountain/logs client-mountain
          copy forge/build/smoke-mountain/crash-reports client-mountain
          copy forge/build/smoke-mountain/screenshots client-mountain
          copy forge/build/smoke-mountain/alpineshred-smoke.txt client-mountain
          copy forge/build/smoke-worldgen/logs client-worldgen
          copy forge/build/smoke-worldgen/crash-reports client-worldgen
          copy forge/build/smoke-worldgen/screenshots client-worldgen
          copy forge/build/smoke-worldgen/alpineshred-smoke.txt client-worldgen
          copy forge/build/smoke-park/logs client-park
          copy forge/build/smoke-park/crash-reports client-park
          copy forge/build/smoke-park/screenshots client-park
          copy forge/build/smoke-park/alpineshred-smoke.txt client-park
          copy forge/build/smoke-lift/logs client-lift
          copy forge/build/smoke-lift/crash-reports client-lift
          copy forge/build/smoke-lift/screenshots client-lift
          copy forge/build/smoke-lift/alpineshred-smoke.txt client-lift
          for r in server rider watcher1 watcher2; do
            copy forge/build/smoke-$r/logs multi/$r
            copy forge/build/smoke-$r/crash-reports multi/$r
            copy forge/build/smoke-$r/screenshots multi/$r
            copy forge/build/smoke-$r/alpineshred-smoke.txt multi/$r
            copy forge/build/smoke-$r/alpineshred-server-smoke.txt multi/$r
          done
          copy forge/build/gametest/logs forge-gametest
          copy forge/build/gametest/crash-reports forge-gametest
          USERDEV=$(find ~/.gradle/caches -name "forge-*-userdev.jar" 2>/dev/null | head -1)
          if [ -n "$USERDEV" ]; then unzip -p "$USERDEV" config.json > "$L/forge-userdev-config.json" || true; fi
          echo "run ${{ github.run_id }} for ${{ github.sha }} (${{ job.status }})" > "$L/RUN.txt"
          cd "$L"
          git init -q -b ci-logs
          git config user.name "ci-logs"
          git config user.email "ci-logs@users.noreply.github.com"
          git add -A
          git commit -qm "Logs for run ${{ github.run_id }} on ${{ github.sha }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" HEAD:ci-logs

      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jars
          path: |
            fabric/build/libs/*.jar
            forge/build/libs/*.jar
          if-no-files-found: ignore

  # Phase 9, decision 4: the same game tests with Create (and its Flywheel, Ponder, Registrate) on the dev
  # runtime, on both loaders. A parallel job, so the 120-minute budget of the main job is untouched; its logs go
  # to ci-logs-create so they never overwrite the main job's ci-logs.
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GRADLE_ARGS: >-
        --stacktrace --no-daemon
        -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
        -Porg.gradle.java.installations.auto-download=false
        -PwithCreate
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v5

      - name: Prepare log folder
        run: mkdir -p "$RUNNER_TEMP/ci-logs"

      # Loom does not unpack Create Fabric's jar-in-jar content; see the script (README 77, 79).
      - name: Unpack Create's nested jars (Fabric)
        run: .github/scripts/unpack-create-nested.sh

      # Create Fabric registers its own game tests, and Fabric API runs every mod's, so Gradle's exit code also
      # reflects Create's (README 77). The run is allowed to fail; gametest-junit-check.py then judges only ours:
      # junit.xml must exist, at least as many of our tests as FabricGameTests declares must have run, none failed.
      - name: Fabric game tests with Create (headless dedicated server)
        timeout-minutes: 20
        run: |
          set +e
          ./gradlew :fabric:runGametest $GRADLE_ARGS 2>&1 | tee "$RUNNER_TEMP/ci-logs/3-fabric-gametest-create.log"
          echo "gradle exit code ${PIPESTATUS[0]} (Create's own tests may fail it; the check below decides)"
          EXPECTED=$(grep -c '^ *@GameTest(' fabric/src/main/java/io/github/adang101/alpineshred/fabric/gametest/FabricGameTests.java)
          python3 .github/scripts/gametest-junit-check.py fabric/build/gametest/junit.xml fabricgametests. "$EXPECTED" \
            | tee "$RUNNER_TEMP/ci-logs/3b-fabric-gametest-create-check.log"
          exit ${PIPESTATUS[0]}

      - name: Forge game tests with Create (headless game-test server)
        if: success() || failure()
        timeout-minutes: 20
        run: |
          mkdir -p forge/build/gametest && echo "eula=true" > forge/build/gametest/eula.txt
          ./gradlew :forge:runGameTestServer $GRADLE_ARGS 2>&1 | tee "$RUNNER_TEMP/ci-logs/4-forge-gametest-create.log"

      # Best effort: runs on other branches force-push the same log branch, and a lost race ("cannot lock ref")
      # is not a test result. The step still shows its error; the job's outcome comes from the tests.
      - name: Publish logs to the ci-logs-create branch
        if: always()
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          L="$RUNNER_TEMP/ci-logs"
          copy() { if [ -e "$1" ]; then mkdir -p "$L/$2" && cp -r "$1" "$L/$2/" ; fi; }
          copy fabric/build/gametest/logs fabric-gametest
          copy fabric/build/gametest/crash-reports fabric-gametest
          copy fabric/build/gametest/junit.xml fabric-gametest
          copy forge/build/gametest/logs forge-gametest
          copy forge/build/gametest/crash-reports forge-gametest
          echo "run ${{ github.run_id }} for ${{ github.sha }} (${{ job.status }}) with Create" > "$L/RUN.txt"
          cd "$L"
          git init -q -b ci-logs-create
          git config user.name "ci-logs"
          git config user.email "ci-logs@users.noreply.github.com"
          git add -A
          git commit -qm "Create-column logs for run ${{ github.run_id }} on ${{ github.sha }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" HEAD:ci-logs-create
