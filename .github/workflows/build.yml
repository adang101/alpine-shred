name: build

on:
  push:
    branches: ['**', '!ci-logs']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        # Explicit bash turns on pipefail, so piping Gradle through tee keeps its exit code.
        shell: bash
    env:
      # Gradle runs on 21 (Architectury Loom 1.11 needs it); the mod compiles, tests and runs on 17.
      GRADLE_ARGS: >-
        --stacktrace --no-daemon
        -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
        -Porg.gradle.java.installations.auto-download=false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v5

      - name: Prepare log folder
        run: mkdir -p "$RUNNER_TEMP/ci-logs"

      # Data generation first: tags, recipes, loot and lang feed the jars and the game tests.
      - name: Generate data (Fabric datagen into common/src/main/generated)
        timeout-minutes: 20
        run: .github/scripts/run-datagen.sh "$RUNNER_TEMP/ci-logs/1-datagen.log" $GRADLE_ARGS

      - name: Compile all modules, run unit tests, build jars
        if: success() || failure()
        run: ./gradlew build --continue $GRADLE_ARGS 2>&1 | tee "$RUNNER_TEMP/ci-logs/2-build.log"

      - name: Fabric game tests (headless dedicated server)
        if: success() || failure()
        timeout-minutes: 15
        run: ./gradlew :fabric:runGametest $GRADLE_ARGS 2>&1 | tee "$RUNNER_TEMP/ci-logs/3-fabric-gametest.log"

      - name: Forge game tests (headless game-test server)
        if: success() || failure()
        timeout-minutes: 15
        run: |
          mkdir -p forge/build/gametest && echo "eula=true" > forge/build/gametest/eula.txt
          ./gradlew :forge:runGameTestServer $GRADLE_ARGS 2>&1 | tee "$RUNNER_TEMP/ci-logs/4-forge-gametest.log"

      # The real Forge client on a virtual display (Mesa software GL): starts, creates a flat world,
      # rides a generated run with simulated keys, takes screenshots and quits (ClientSmoke). Forge,
      # because the Fabric dev client cannot start: Trinkets 3.7.2 shadows a Yarn field name that
      # does not resolve under Mojang mappings in development (production jars are unaffected).
      - name: Client smoke test (Forge client, virtual display)
        if: success() || failure()
        timeout-minutes: 20
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          mkdir -p forge/build/smoke/config
          printf '%s\n' onboardAccessibility:false skipMultiplayerWarning:true tutorialStep:none \
            pauseOnLostFocus:false renderDistance:6 simulationDistance:6 narrator:0 maxFps:30 \
            joinedFirstServer:true soundCategory_master:0.0 > forge/build/smoke/options.txt
          printf 'earlyWindowControl = false\n' > forge/build/smoke/config/fml.toml
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :forge:runSmokeClient $GRADLE_ARGS 2>&1 \
            | tee "$RUNNER_TEMP/ci-logs/6-client-smoke.log"
          cat forge/build/smoke/alpineshred-smoke.txt
          grep -q "^RESULT PASS" forge/build/smoke/alpineshred-smoke.txt

      - name: Probe API signatures (when .github/api-probe.txt exists)
        if: (success() || failure()) && hashFiles('.github/api-probe.txt') != ''
        run: .github/scripts/api-probe.sh "$RUNNER_TEMP/ci-logs/api" .github/api-probe.txt

      - name: Committed generated data is up to date
        if: success() || failure()
        run: |
          git add -N common/src/main/generated
          if ! git diff --quiet -- common/src/main/generated; then
            echo "::error::Generated data differs from the committed copy. Run ./gradlew :fabric:runDatagen and commit common/src/main/generated."
            git diff --stat -- common/src/main/generated | tee "$RUNNER_TEMP/ci-logs/5-generated-diff.log"
            exit 1
          fi

      # Logs, reports and generated data also go to the ci-logs branch, readable with plain git
      # from environments that cannot download Actions artifacts.
      - name: Publish logs to the ci-logs branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          L="$RUNNER_TEMP/ci-logs"
          copy() { if [ -e "$1" ]; then mkdir -p "$L/$2" && cp -r "$1" "$L/$2/" ; fi; }
          copy common/src/main/generated generated
          copy common/build/test-results test-results
          copy common/build/reports/tests reports
          copy fabric/build/gametest/logs fabric-gametest
          copy fabric/build/gametest/crash-reports fabric-gametest
          copy fabric/build/gametest/junit.xml fabric-gametest
          copy fabric/build/datagen/logs fabric-datagen
          copy forge/build/smoke/logs client-smoke
          copy forge/build/smoke/crash-reports client-smoke
          copy forge/build/smoke/screenshots client-smoke
          copy forge/build/smoke/alpineshred-smoke.txt client-smoke
          copy forge/build/gametest/logs forge-gametest
          copy forge/build/gametest/crash-reports forge-gametest
          USERDEV=$(find ~/.gradle/caches -name "forge-*-userdev.jar" 2>/dev/null | head -1)
          if [ -n "$USERDEV" ]; then unzip -p "$USERDEV" config.json > "$L/forge-userdev-config.json" || true; fi
          echo "run ${{ github.run_id }} for ${{ github.sha }} (${{ job.status }})" > "$L/RUN.txt"
          cd "$L"
          git init -q -b ci-logs
          git config user.name "ci-logs"
          git config user.email "ci-logs@users.noreply.github.com"
          git add -A
          git commit -qm "Logs for run ${{ github.run_id }} on ${{ github.sha }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" HEAD:ci-logs

      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jars
          path: |
            fabric/build/libs/*.jar
            forge/build/libs/*.jar
          if-no-files-found: ignore
