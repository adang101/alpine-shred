plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

// Resolved up front: inside Loom's run closures, rootProject/project resolve against the run config.
def modId = rootProject.mod_id
def generatedDir = project(':common').file('src/main/generated')
def gametestReport = file('build/gametest/junit.xml')
// -PwithCreate: Create on the dev runtime and the game tests told so (the CI column with Create, README 77).
def withCreate = project.hasProperty('withCreate')

loom {
    runs {
        // Data generation writes into common so both loaders ship the same files (section 4).
        datagen {
            inherit server
            name 'Data Generation'
            vmArg '-Dfabric-api.datagen'
            vmArg "-Dfabric-api.datagen.output-dir=${generatedDir}"
            vmArg "-Dfabric-api.datagen.modid=${modId}"
            runDir 'build/datagen'
        }
        // Headless dedicated-server game tests; the process exits non-zero if a required test fails.
        gametest {
            inherit server
            name 'Game Test'
            vmArg '-Dfabric-api.gametest'
            if (withCreate) vmArg '-Dalpineshred.create=true'
            vmArg "-Dfabric-api.gametest.report-file=${gametestReport}"
            runDir 'build/gametest'
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Bundled into the mod jar by Shadow. Do not use Shadow's own `shadow` configuration.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

// The Create jar as published (unremapped), only to read the jars nested inside it. Create column only.
// Loom does not unpack that jar-in-jar content for the dev runtime and reads mod dependencies while the
// project is configured, so the nested jars are copied out right here, then added as runtime mods below.
def createNestedJars = []
if (withCreate) {
    configurations {
        createFabricJar {
            canBeResolved = true
            canBeConsumed = false
            transitive = false
        }
    }
    dependencies {
        createFabricJar "maven.modrinth:create-fabric:${rootProject.create_fabric_version}"
    }
    def nestedDir = layout.buildDirectory.dir('create-nested').get().asFile
    copy {
        from(zipTree(configurations.createFabricJar.singleFile)) {
            include 'META-INF/jars/*.jar'
            eachFile { it.path = it.name }
            includeEmptyDirs = false
        }
        into nestedDir
    }
    // core, toml and jsr305 are plain libraries, not mods.
    createNestedJars = (nestedDir.listFiles() as List).findAll {
        it.name.endsWith('.jar') && !['core-', 'toml-', 'jsr305-'].any { prefix -> it.name.startsWith(prefix) }
    }.sort { it.name }
}

dependencies {
    // Create Fabric 6.0.8.1 declares fabricloader >= 0.17.2; only the Create column needs the newer loader.
    modImplementation "net.fabricmc:fabric-loader:${withCreate ? rootProject.create_fabric_loader_version : rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modImplementation "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"

    modImplementation "dev.kosmx.player-anim:player-animation-lib-fabric:${rootProject.player_anim_version}"
    modImplementation "dev.emi:trinkets:${rootProject.trinkets_version}"

    // Create is optional: compile against it, and run with it only for the Create column. Its jar carries
    // Flywheel, Ponder, Registrate and Porting Lib inside it: one coordinate to compile, the nested jars for the runtime.
    if (withCreate) {
        modImplementation "maven.modrinth:create-fabric:${rootProject.create_fabric_version}"
        createNestedJars.each { modRuntimeOnly files(it) }
    } else {
        modCompileOnly "maven.modrinth:create-fabric:${rootProject.create_fabric_version}"
    }

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    def props = [
            version    : project.version,
            mod_id     : rootProject.mod_id,
            mod_name   : rootProject.mod_name,
            mod_license: rootProject.mod_license,
            mod_authors: rootProject.mod_authors,
            arch_api   : rootProject.architectury_api_version,
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
